<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dostępność serwerów OVH</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.45 system-ui, sans-serif; background: #0b1020; color: #e8ecf5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1100px, calc(100% - 32px)); margin: 48px auto; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    h1 { margin: 0 0 4px; font-size: clamp(24px, 4vw, 38px); }
    p { margin: 0; color: #99a5bd; }
    .filters { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .field, fieldset { min-width: 0; margin: 0; border: 1px solid #26324d; border-radius: 10px; background: #131b2e; padding: 7px 12px 9px; }
    .field > span, legend { color: #8794ae; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .field input, .field select { display: block; width: 100%; min-height: 26px; border: 0; border-radius: 0; padding: 0; background: transparent; }
    fieldset { padding-top: 4px; }
    legend { padding: 0 5px; }
    #ram { display: flex; flex-wrap: wrap; gap: 5px 12px; }
    #ram label { white-space: nowrap; cursor: pointer; }
    #ram input { min-height: auto; margin: 0 4px 0 0; padding: 0; accent-color: #3570ff; }
    input, select, button { min-height: 44px; border: 1px solid #26324d; border-radius: 10px; background: #131b2e; color: inherit; padding: 0 14px; font: inherit; }
    button { cursor: pointer; background: #2056d7; border-color: #3570ff; font-weight: 650; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 24px; margin-bottom: 10px; }
    .grid { display: grid; gap: 10px; }
    article { border: 1px solid #202b44; border-radius: 14px; background: #11182a; padding: 18px; }
    .top { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
    h2 { margin: 0 0 7px; font: 650 17px/1.35 ui-monospace, monospace; overflow-wrap: anywhere; }
    .details { display: flex; flex-wrap: wrap; gap: 7px 18px; color: #aab4c8; font-size: 14px; }
    .dcs { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
    .badge { border-radius: 99px; padding: 4px 9px; background: #18362c; color: #74e7b3; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .badge.low { background: #3b3019; color: #ffd172; }
    .error { color: #ff8d99; }
    .empty { text-align: center; padding: 48px 16px; color: #99a5bd; }
    @media (max-width: 760px) { header { align-items: start; flex-direction: column; } .filters { grid-template-columns: 1fr; } button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Dostępne serwery OVH</h1>
        <p>Serwery z kodem <strong>SYS</strong> lub <strong>SK</strong> dostępne w centrach danych OVH.</p>
      </div>
      <button id="refresh" type="button">Odśwież dane</button>
    </header>

    <section class="filters" aria-label="Filtry">
      <label class="field">
        <span>Szukaj</span>
        <input id="search" type="search" placeholder="FQN, procesor, RAM lub dysk…">
      </label>
      <label class="field">
        <span>Centrum danych</span>
        <select id="datacenter"><option value="waw" selected>WAW</option></select>
      </label>
      <label class="field">
        <span>Maks. pojemność jednego dysku</span>
        <select id="disk">
          <option value="">Dowolna</option>
          <option value="512">≤ 512 GB</option>
          <option value="1024" selected>≤ 1 TB</option>
          <option value="2048">≤ 2 TB</option>
          <option value="4096">≤ 4 TB</option>
        </select>
      </label>
      <fieldset>
        <legend>RAM</legend>
        <div id="ram"></div>
      </fieldset>
    </section>

    <p id="status" role="status"></p>
    <section id="results" class="grid" aria-live="polite"></section>
  </main>

  <script>
    const API = 'https://www.ovh.com/engine/apiv6/dedicated/server/datacenter/availabilities/';
    const CATALOG = 'https://eu.api.ovh.com/v1/order/catalog/public/eco?ovhSubsidiary=PL';
    const cpuLabel = cpu => cpu?.model ? [
      `${cpu.number > 1 ? `${cpu.number}× ` : ''}${cpu.brand || ''} ${cpu.model}`.trim(),
      cpu.cores && cpu.threads ? `${cpu.cores} rdzeni / ${cpu.threads} wątków${cpu.number > 1 ? ' na procesor' : ''}` : '',
      cpu.frequency ? `${cpu.frequency}${cpu.boost ? `–${cpu.boost}` : ''} GHz` : ''
    ].filter(Boolean).join(' · ') : 'brak danych';
    const available = value => typeof value === 'string' && value !== 'unavailable' && value !== 'unknown';
    const wanted = server => typeof server?.fqn === 'string' && /^.{2}(?:sys|sk)/i.test(server.fqn);
    const diskSizes = storage => [...(storage || '').matchAll(/\d+x(\d+)/gi)].map(match => Number(match[1]));
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    console.assert(wanted({ fqn: '24sk102.ram-32g' }), 'Błąd dopasowania serwerów SK');
    console.assert(Math.max(...diskSizes('hybridsoftraid-2x6000sa-2x960nvme')) === 6000, 'Błąd odczytu pojemności dysków');
    let servers = [];
    let catalogWarning = '';

    const search = document.querySelector('#search');
    const datacenter = document.querySelector('#datacenter');
    const disk = document.querySelector('#disk');
    const ram = document.querySelector('#ram');
    const results = document.querySelector('#results');
    const status = document.querySelector('#status');
    const refresh = document.querySelector('#refresh');

    function render() {
      const query = search.value.trim().toLowerCase();
      const dc = datacenter.value;
      const maxDisk = Number(disk.value);
      const selectedRam = [...ram.querySelectorAll(':checked')].map(input => Number(input.value));
      const filtered = servers.filter(server => {
        const text = [server.fqn, server.cpu, server.memory, server.storage].join(' ').toLowerCase();
        const memory = Number(server.memory?.match(/ram-(\d+)g/i)?.[1]);
        const disks = diskSizes(server.storage);
        return (!query || text.includes(query))
          && (!dc || server.datacenters.some(item => item.datacenter === dc))
          && selectedRam.includes(memory)
          && (!maxDisk || (disks.length && Math.max(...disks) <= maxDisk));
      });

      status.textContent = `${filtered.length} konfiguracji${catalogWarning}`;
      results.innerHTML = filtered.length ? filtered.map(server => `
        <article>
          <div class="top"><div>
            <h2>${escapeHtml(server.fqn)}</h2>
            <div class="details">
              <span>CPU: ${escapeHtml(server.cpu)}</span>
              <span>RAM: ${escapeHtml(server.memory || '—')}</span>
              <span>Dyski: ${escapeHtml(server.storage || '—')}</span>
            </div>
          </div></div>
          <div class="dcs">${server.datacenters.map(item => `<span class="badge ${item.availability.includes('low') ? 'low' : ''}">${escapeHtml(item.datacenter)} · ${escapeHtml(item.availability)}</span>`).join('')}</div>
        </article>`).join('') : '<div class="empty">Brak serwerów spełniających wybrane kryteria.</div>';
    }

    async function load() {
      refresh.disabled = true;
      status.textContent = 'Pobieranie danych…';
      results.innerHTML = '';
      try {
        const [availabilityResult, catalogResult] = await Promise.allSettled([
          fetch(API, { cache: 'no-store' }),
          fetch(CATALOG, { cache: 'no-store', signal: AbortSignal.timeout(15000) }).then(async response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const catalog = await response.json();
            if (!Array.isArray(catalog.plans) || !Array.isArray(catalog.products)) throw new Error('Nieprawidłowy katalog');
            return catalog;
          })
        ]);
        if (availabilityResult.status === 'rejected') throw availabilityResult.reason;
        const response = availabilityResult.value;
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('Nieprawidłowy format odpowiedzi');
        const catalog = catalogResult.status === 'fulfilled' ? catalogResult.value : { plans: [], products: [] };
        catalogWarning = catalogResult.status === 'rejected' ? ' · Nie udało się pobrać informacji o procesorach.' : '';
        const products = new Map(catalog.products.map(product => [product.name, product]));
        const cpus = new Map(catalog.plans.map(plan => [plan.planCode, cpuLabel(products.get(plan.product)?.blobs?.technical?.server?.cpu)]));

        servers = data.filter(wanted).map(server => ({
          ...server,
          cpu: cpus.get(server.planCode) || 'brak danych',
          datacenters: Array.isArray(server.datacenters) ? server.datacenters.filter(item => available(item.availability)) : []
        })).filter(server => server.datacenters.length);

        const selected = datacenter.value;
        const centers = [...new Set(servers.flatMap(server => server.datacenters.map(item => item.datacenter)))].sort();
        datacenter.innerHTML = '<option value="">Wszystkie centra danych</option>' + centers.map(dc => `<option value="${escapeHtml(dc)}"${dc === selected ? ' selected' : ''}>${escapeHtml(dc.toUpperCase())}</option>`).join('');

        const selectedMemory = new Set([...ram.querySelectorAll(':checked')].map(input => Number(input.value)));
        const memories = [...new Set(servers.map(server => Number(server.memory?.match(/ram-(\d+)g/i)?.[1])).filter(Boolean))].sort((a, b) => a - b);
        ram.innerHTML = memories.map(value => `<label><input type="checkbox" value="${value}"${(selectedMemory.size ? selectedMemory.has(value) : value === 32 || value === 64) ? ' checked' : ''}>${value} GB</label>`).join('');
        render();
      } catch (error) {
        status.innerHTML = `<span class="error">Nie udało się pobrać danych: ${escapeHtml(error.message)}</span>`;
        results.innerHTML = '<div class="empty">Spróbuj ponownie za chwilę.</div>';
      } finally {
        refresh.disabled = false;
      }
    }

    search.addEventListener('input', render);
    datacenter.addEventListener('change', render);
    disk.addEventListener('change', render);
    ram.addEventListener('change', render);
    refresh.addEventListener('click', load);
    document.addEventListener('visibilitychange', () => !document.hidden && !refresh.disabled && load());
    load();
  </script>
</body>
</html>
